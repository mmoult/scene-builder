# top-level color: applied to all unless overridden
color: [75, 130, 242]
# opacity is likewise inherited.
opaque: false

data:
-
  strip:
  - [0, 2, 2]
  - [3, 1, 1]
  - [2, 1, 3]
  color: [160, 35, 200]
  opaque: true
-
  strip:
  - [1, 1.5, 0]
  - [2, 2, 1]
  - [1, 2.5, 2]
-
  min: [1.0, 0.0, 0.0]
  max: [2.0, 1.0, 1.0]
  color: [204, 58, 18]
