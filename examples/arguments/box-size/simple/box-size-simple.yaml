geom:
  data:
  - strip:
    - [-1, -1, -1]
    - [1, -1, -1]
    - [-2, 0, -2]
    - [2, 0, -2]
    color: [250, 0, 0]
  - strip:
    - [-1, -1, -1]
    - [-1, -1, 1]
    - [-2, 0, -2]
    - [-2, 0, 2]
    color: [0, 255, 0]
  - strip:
    - [-1, -1, 1]
    - [1, -1, 1]
    - [-2, 0, 2]
    - [2, 0, 2]
    color: [0, 0, 255]
  - strip:
    - [1, -1, -1]
    - [1, -1, 1]
    - [2, 0, -2]
    - [2, 0, 2]
    color: [100, 255, 0]

scale: [1, 1, 1]
instance: geom